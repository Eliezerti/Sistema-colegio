name: Aplicación Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'colegio/**'
      - 'static/**'
      - 'tests/**'
      - 'packaging/**'
      - 'desktop_entry.py'
      - 'requirements-desktop.txt'

permissions:
  contents: write

concurrency:
  group: windows-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Compilar y validar el sistema
        shell: pwsh
        run: |
          try {
            ./packaging/build_windows.ps1 -Version "1.0.${{ github.run_number }}" *>&1 | Tee-Object -FilePath desktop-build.log
          } catch {
            $Details = ((Get-Content desktop-build.log | Select-Object -Last 45) -join "`n")
            $Details = $Details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Compilación Windows::$Details"
            throw
          }
      - name: Analizar con Defender antes de ejecutar el instalador
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist
      - name: Validar instalación, ventanas, pruebas y conservación de datos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./packaging/test_installer.ps1 -Version "1.0.${{ github.run_number }}"
          } catch {
            $Details = $_.Exception.Message + "`n" + ((Get-Content "$env:TEMP/AulaColegio-Compilacion/logs/*.log" -ErrorAction SilentlyContinue) -join "`n")
            $Details = $Details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Ventana Windows::$Details"
            throw
          }
      - name: Repetir análisis de Defender tras pruebas de ejecución
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist -ReportDir "$env:RUNNER_TEMP/defender-after-runtime"
      - name: Guardar diagnóstico de la ventana si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Windows
          path: C:/Users/runneradmin/AppData/Local/Temp/AulaColegio-Compilacion/logs/*.log
          if-no-files-found: ignore
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Aula-Windows-Instalador
          path: |
            dist/Aula-Colegio-Instalador-*.exe
            dist/Aula-Colegio-Instalador-*.sha256
          if-no-files-found: error
      - name: Conservar resultados de Defender
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Defender-Windows
          path: |
            ${{ runner.temp }}/Aula-Antivirus/
            ${{ runner.temp }}/defender-after-runtime/
          if-no-files-found: ignore
      - name: Publicar instalador descargable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = "1.0.${{ github.run_number }}"
          $Body = @'
          Aplicación local para una PC Windows 10/11 de 64 bits. Incluye Python, ventana propia, acceso directo y perfil de pruebas independiente. Una nueva instalación solicita el nombre del colegio y crea una base vacía; las actualizaciones conservan los datos e identidad del colegio existente. Instala con la misma cuenta de Windows y crea un respaldo externo antes de actualizar.

          Novedades: nueva identidad de Aula Colegio · ELIEZER PEREZ. Logos oficiales, paleta azul y verde, tipografía Lato incluida para uso sin internet, iconos de Windows y accesos directos actualizados. La marca del producto se distingue de la identidad fiscal de cada colegio: conserva escudo, RIF, configuración, datos y documentos históricos. Incluye el mismo motor de cobros, respaldo y mantenimiento de la versión anterior.

          Emite comprobantes administrativos, no facturas fiscales. Esta versión no certifica cumplimiento de todos los requisitos de SENIAT o Zona Educativa. La tasa BCV se registra manualmente. Cerrar X oculta la aplicación junto al reloj; usa Salir y cerrar Aula para detenerla. WebView2 de Microsoft puede requerir conexión en la primera instalación.

          La compilación ejecuta pruebas financieras y de recuperación, análisis de Microsoft Defender antes y después de las pruebas de instalación, ventana nativa y conservación de datos. Un resultado de análisis sin detecciones solo corresponde a ese archivo y esas firmas; no garantiza ausencia universal de amenazas ni explica por sí solo la detección anterior de 1.0.8. No desactives Defender ni añadas exclusiones para instalar un archivo bloqueado.
          '@
          [System.IO.File]::WriteAllText('dist/notas-version.txt', $Body, [System.Text.UTF8Encoding]::new($false))
          # Keep the artifact as a draft until checks and its release notes have been reviewed.
          $ReleaseOutput = @(gh release create "desktop-$Version" "dist/Aula-Colegio-Instalador-$Version.exe" "dist/Aula-Colegio-Instalador-$Version.exe.sha256" "descargas/Aula-Windows.zip" "descargas/Aula-Windows.sha256" --target $env:GITHUB_SHA --title "Aula Colegio - Windows $Version - revisión" --notes-file dist/notas-version.txt --draft 2>&1)
          $ReleaseExit = $LASTEXITCODE
          $ReleaseOutput | ForEach-Object { Write-Host $_ }
          if ($ReleaseExit -ne 0) {
            $Details = ($ReleaseOutput | ForEach-Object { "$_" }) -join "`n"
            $Details = $Details.Substring(0,[Math]::Min(3500,$Details.Length)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Guardar borrador del instalador::$Details"
            throw 'No se pudo guardar el borrador del instalador; no se ha publicado una descarga pública.'
          }
