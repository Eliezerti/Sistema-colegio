name: Aplicación Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'colegio/**'
      - 'static/**'
      - 'tests/**'
      - 'packaging/**'
      - 'desktop_entry.py'
      - 'requirements-desktop.txt'

permissions:
  contents: write

concurrency:
  group: windows-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Compilar y validar el sistema
        shell: pwsh
        run: |
          try {
            ./packaging/build_windows.ps1 -Version "1.0.${{ github.run_number }}" *>&1 | Tee-Object -FilePath desktop-build.log
          } catch {
            $Details = ((Get-Content desktop-build.log | Select-Object -Last 45) -join "`n")
            $Details = $Details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Compilación Windows::$Details"
            throw
          }
      - name: Analizar con Defender antes de ejecutar el instalador
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist
      - name: Validar instalación, ventanas, pruebas y conservación de datos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./packaging/test_installer.ps1 -Version "1.0.${{ github.run_number }}"
          } catch {
            $Details = $_.Exception.Message + "`n" + ((Get-Content "$env:TEMP/AulaColegio-Compilacion/logs/*.log" -ErrorAction SilentlyContinue) -join "`n")
            $Details = $Details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Ventana Windows::$Details"
            throw
          }
      - name: Repetir análisis de Defender tras pruebas de ejecución
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist -ReportDir "$env:RUNNER_TEMP/defender-after-runtime"
      - name: Guardar diagnóstico de la ventana si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Windows
          path: C:/Users/runneradmin/AppData/Local/Temp/AulaColegio-Compilacion/logs/*.log
          if-no-files-found: ignore
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Aula-Windows-Instalador
          path: |
            dist/Aula-Colegio-Instalador-*.exe
            dist/Aula-Colegio-Instalador-*.sha256
          if-no-files-found: error
      - name: Conservar resultados de Defender
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Defender-Windows
          path: |
            ${{ runner.temp }}/Aula-Antivirus/
            ${{ runner.temp }}/defender-after-runtime/
          if-no-files-found: ignore
      - name: Publicar instalador descargable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = "1.0.${{ github.run_number }}"
          $Body = @'
          BORRADOR: pendientes las alertas de Defender reportadas para 1.0.8 y 1.0.14. Los análisis del runner no resuelven por sí solos el reporte del equipo del usuario.

          Aplicación local para una PC Windows 10/11 de 64 bits. Incluye Python, ventana propia, acceso directo y perfil de pruebas independiente. Una nueva instalación solicita el nombre del colegio y crea una base vacía; las actualizaciones conservan los datos e identidad del colegio existente. Instala con la misma cuenta de Windows y crea un respaldo externo antes de actualizar.

          A3: sesiones de 15 minutos sin actividad, configurables entre 5 y 60, con aviso un minuto antes. Tiempos monotónicos, máximo absoluto de doce horas, tokens guardados solo como SHA-256 y nuevo ingreso al reiniciar Aula. Formularios habituales conservados solo en RAM para el mismo usuario y perfil, sin contraseñas y sin guardado automático. Recuperación local cierra todas las sesiones y deja aviso persistente para cada administrador. Espera progresiva por cuenta/origen-cuenta sin prohibición global de la IP local. Guía instalada sesiones-acceso.html. Sin migración SQL; no cambia datos financieros, móvil/PWA o nómina.

          A2: cifrado AES-256-GCM/scrypt de todas las salidas de respaldo gestionadas por Aula: segundo destino, descarga y externas previas a vaciar/borrar. Recuperación mostrada una vez con confirmación de últimos cuatro; Windows DPAPI protege solo material derivado fuera de SQLite. Cambiar contraseña afecta solo copias nuevas; antiguas usan su contraseña de entonces o recuperación. Publicación atómica después de descifrar/verificar huella, integridad y referencias; temporales externos siempre cifrados. No cambia copias locales de cinco minutos/diarias ni borra originales antiguos o especiales. Formato AULABK01 documentado.

          Configura Cifrado de respaldos en Protección y mantenimiento después de actualizar; guarda la recuperación fuera de la PC, separada de la copia. Restaurar y Probar respaldo admiten .aulabak y antiguas .sqlite3 con advertencia, conservando A1. Basta archivo + contraseña o recuperación en otra PC. Convertir y descargar cifrado crea otra copia sin borrar la original; no elimina versiones antiguas de Drive. Sin migración SQL, cambio de ubicación, nómina ni móvil. No hay firma nueva ni SQLCipher.

          A1: restauración con comparación por identidad/contenido y confirmación reforzada si se pierden o revierten datos. Conserva máximos de correlativos R-/E-/AL-/M-, copia anterior, archivos originales e informes PDF/CSV de pérdida. Una intención persistente permite completar la restauración confirmada después de un cierre inesperado antes de abrir/generar mensualidades; un registro ilegible bloquea el inicio y conserva las copias. Esquemas futuros se rechazan. Sin migración nueva, cifrado ni cambios de nómina/móvil/sesiones.

          Probar respaldo: Configuración → Protección y mantenimiento o Inicio → Aula Colegio → Probar respaldo; funciona sin abrir la base activa, copia el archivo a un temporal y no escribe en el USB/origen. La fecha de creación desconocida se indica sin deducirla del nombre. Restauración con Aula completamente cerrado. Guía instalada restauracion-segura.html incluye prueba ficticia, limitaciones y recuperación de base ilegible: los correlativos desconocidos deben revisarse, nunca inventarse como cero.

          Recibos de pago: nombre y grado del alumno, sin cédula escolar ni código AL-. Conserva el número R- y los datos del representante; la identificación escolar y el código permanecen en ficha/constancia, sin alterar pagos ni instantáneas. Cobros por Pago móvil separados en reportes y cierre; arqueo distingue efectivo físico inicial del saldo bancario.

          Archivo de la institución: Administración revisa, archiva y recupera alumnos, representantes y personal en un módulo separado. Borrado definitivo solo para fichas archivadas sin movimientos ni vínculos, con contraseña, motivo, revisión vigente y copias previas verificadas. Saldo de $0 no autoriza borrar historial financiero; personal utiliza estado Inactivo sin cambiar cálculos de nómina. Sin migración de esquema ni borrado automático.

          Carpeta de nube: Administración puede declarar manualmente una carpeta de Drive, OneDrive o Dropbox después de revisar una copia reciente en su web. Sustituye solo el aviso de disco desconocido por un recordatorio discreto; Aula no verifica la subida. Los fallos, copias antiguas y aviso de mismo disco permanecen. CSRF, reloj y bitácora protegen la confirmación; cambiar la ruta o usar otra PC exige revisar de nuevo. Sin migración de esquema ni cambio de datos contables.

          Configuración organizada en apartados de Identidad y calendario, Protección y mantenimiento, Usuarios y acceso y Bitácora. Conserva borradores de identidad/destino durante la sesión y guarda cada formulario por separado. El destino de copias no cambia calendario ni identidad. Ayuda de BitLocker explica la clave de recuperación de 48 dígitos y la distingue de una llave de acceso; los resultados desconocidos se muestran en ámbar sin presentarlos como activos. No activa BitLocker, migra el esquema ni modifica datos financieros.

          Novedades de Fase 1, punto 2: protección persistente del reloj. Avances mayores de siete días entre aperturas, retrocesos mayores de dos minutos y saltos inesperados durante el uso detienen cobros, mensualidades y documentos. Solo Administrador confirma con CSRF y registro en bitácora. Puede aparecer una revisión inicial de una base con actividad sin control previo. Conservación de respaldos por secuencia de publicación, independiente de nombres y fechas corregidas. Intentos de acceso con tiempo monotónico. Conserva avisos de respaldo, revisión de ACL/BitLocker, importación/exportación, documentos y datos anteriores. La copia en una carpeta no confirma subida a la nube; hay aviso por mismo disco o ubicación desconocida. No cambia el esquema, ubicación, importes existentes, WAL, synchronous=FULL ni frecuencia de cinco minutos. Incluye cifrado portable de respaldos A2, no SQLCipher.

          Emite comprobantes administrativos, no facturas fiscales. Esta versión no certifica cumplimiento de todos los requisitos de SENIAT o Zona Educativa. La tasa BCV se registra manualmente. Cerrar X oculta la aplicación junto al reloj; usa Salir y cerrar Aula para detenerla. WebView2 de Microsoft puede requerir conexión en la primera instalación.

          La compilación ejecuta pruebas financieras y de recuperación, análisis de Microsoft Defender antes y después de las pruebas de instalación, ventana nativa y conservación de datos. Un resultado de análisis sin detecciones solo corresponde a ese archivo y esas firmas; no garantiza ausencia universal de amenazas ni explica por sí solo la detección anterior de 1.0.8. No desactives Defender ni añadas exclusiones para instalar un archivo bloqueado.
          '@
          [System.IO.File]::WriteAllText('dist/notas-version.txt', $Body, [System.Text.UTF8Encoding]::new($false))
          # Keep the artifact as a draft until checks and its release notes have been reviewed.
          $ReleaseOutput = @(gh release create "desktop-$Version" "dist/Aula-Colegio-Instalador-$Version.exe" "dist/Aula-Colegio-Instalador-$Version.exe.sha256" "descargas/Aula-Windows.zip" "descargas/Aula-Windows.sha256" --target $env:GITHUB_SHA --title "Aula - Sesiones seguras A3 - Windows $Version - revisión" --notes-file dist/notas-version.txt --draft 2>&1)
          $ReleaseExit = $LASTEXITCODE
          $ReleaseOutput | ForEach-Object { Write-Host $_ }
          if ($ReleaseExit -ne 0) {
            $Details = ($ReleaseOutput | ForEach-Object { "$_" }) -join "`n"
            $Details = $Details.Substring(0,[Math]::Min(3500,$Details.Length)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Guardar borrador del instalador::$Details"
            throw 'No se pudo guardar el borrador del instalador; no se ha publicado una descarga pública.'
          }
