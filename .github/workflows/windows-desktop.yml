name: Aplicación Windows
on:
  workflow_dispatch:
    inputs:
      receipt_evidence_run:
        description: 'Solo diagnosticar PDFs nativos ya guardados en esta ejecución (vacío: compilar instalador)'
        required: false
        type: string
      finalize_delivery:
        description: 'Solo actualizar ZIP fuente y notas de un borrador ya validado'
        required: false
        type: boolean
        default: false
      delivery_tag:
        description: 'Borrador ya validado para finalizar documentación y fuente'
        required: false
        type: string
        default: 'desktop-1.0.57'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'colegio/**'
      - 'static/**'
      - 'tests/**'
      - 'packaging/**'
      - 'desktop_entry.py'
      - 'requirements-desktop.txt'

permissions:
  contents: write

concurrency:
  group: windows-desktop
  cancel-in-progress: false

jobs:
  finalize-delivery:
    if: github.event_name == 'workflow_dispatch' && inputs.finalize_delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adjuntar fuente final y huella al borrador verificado
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_TAG: ${{ inputs.delivery_tag }}
        run: |
          test "$(gh release view "$DELIVERY_TAG" --json isDraft --jq .isDraft)" = true
          python tests/package_windows.py --output descargas/Aula-Windows.zip
          gh release upload "$DELIVERY_TAG" descargas/Aula-Windows.zip descargas/Aula-Windows.sha256 --clobber
          gh release view "$DELIVERY_TAG" --json body --jq .body > /tmp/aula-release-notes.md
          printf '\n\nFuente ZIP final con documentación y evidencia: SHA-256 %s. Solo se actualizan documentación/fuente; el EXE validado no cambia.\n' "$(cut -d ' ' -f 1 descargas/Aula-Windows.sha256)" >> /tmp/aula-release-notes.md
          gh release edit "$DELIVERY_TAG" --notes-file /tmp/aula-release-notes.md
          gh release view "$DELIVERY_TAG" --json url,assets
  receipt-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.receipt_evidence_run != '' && !inputs.finalize_delivery
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Comprobante-Media-Carta-Vertical
          run-id: ${{ inputs.receipt_evidence_run }}
          github-token: ${{ github.token }}
          path: receipt-evidence
      - name: Comparar PDFs ficticios de WebView2 sin recompilar
        run: |
          python -m pip install pypdf==6.10.0 PyMuPDF==1.26.6
          python tests/verify_receipt_prints.py receipt-evidence
  build:
    if: (github.event_name != 'workflow_dispatch' || inputs.receipt_evidence_run == '') && !inputs.finalize_delivery
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: B2 inventariar versión anterior antes de excluir módulos
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/inventory_previous.ps1
      - name: Compilar y validar el sistema
        shell: pwsh
        env:
          AULA_PERMISSION_REPORT_DIR: ${{ runner.temp }}/aula-b1-permisos
        run: |
          try {
            ./packaging/build_windows.ps1 -Version "1.0.${{ github.run_number }}" *>&1 | Tee-Object -FilePath desktop-build.log
          } catch {
            $Details = ((Get-Content desktop-build.log | Select-Object -Last 45) -join "`n")
            $Details = $Details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Compilación Windows::$Details"
            throw
          }
      - name: Analizar con Defender antes de ejecutar el instalador
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist
      - name: Validar instalación, ventanas, pruebas y conservación de datos
        shell: pwsh
        env:
          AULA_RECEIPT_REPORT_DIR: ${{ runner.temp }}/aula-recibo-native
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./packaging/test_installer.ps1 -Version "1.0.${{ github.run_number }}"
          } catch {
            $Details = $_.Exception.Message + "`n" + ((Get-Content "$env:TEMP/AulaColegio-Compilacion/logs/*.log" -ErrorAction SilentlyContinue) -join "`n")
            $Details = $Details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Ventana Windows::$Details"
            throw
          }
      - name: Verificar dimensiones y escala del comprobante impreso por WebView2
        shell: pwsh
        run: |
          python -m pip install pypdf==6.10.0 PyMuPDF==1.26.6
          if ($LASTEXITCODE -ne 0) { throw 'No se instaló el verificador independiente de PDF.' }
          python tests/verify_receipt_prints.py "$env:RUNNER_TEMP/aula-recibo-native"
          if ($LASTEXITCODE -ne 0) { throw 'El comprobante impreso cambió tamaño, páginas, contenido o escala.' }
      - name: Conservar evidencia de impresión del comprobante
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Comprobante-Media-Carta-Vertical
          path: ${{ runner.temp }}/aula-recibo-native/
          if-no-files-found: error
      - name: Repetir análisis de Defender tras pruebas de ejecución
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist -ReportDir "$env:RUNNER_TEMP/defender-after-runtime"
      - name: B1 instalación limpia, actualización publicada y otra cuenta Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/test_b1_windows.ps1 -Version "1.0.${{ github.run_number }}"
      - name: Conservar evidencia B1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Verificacion-B1
          path: |
            ${{ runner.temp }}/aula-b1-permisos/
            ${{ runner.temp }}/aula-b1-*.json
            ${{ runner.temp }}/aula-b1-diagnostic/
            ${{ runner.temp }}/defender-b1-historical/
          if-no-files-found: warn
      - name: Conservar inventario B2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Inventario-B2
          path: |
            ${{ runner.temp }}/aula-b2-*.json
            ${{ runner.temp }}/defender-b2-previous/
          if-no-files-found: warn
      - name: Guardar diagnóstico de la ventana si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Windows
          path: C:/Users/runneradmin/AppData/Local/Temp/AulaColegio-Compilacion/logs/*.log
          if-no-files-found: ignore
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Aula-Windows-Instalador
          path: |
            dist/Aula-Colegio-Instalador-*.exe
            dist/Aula-Colegio-Instalador-*.sha256
          if-no-files-found: error
      - name: Conservar resultados de Defender
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Defender-Windows
          path: |
            ${{ runner.temp }}/Aula-Antivirus/
            ${{ runner.temp }}/defender-after-runtime/
          if-no-files-found: ignore
      - name: Publicar instalador descargable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tests/package_windows.py --output descargas/Aula-Windows.zip
          if ($LASTEXITCODE -ne 0) { throw 'El ZIP de fuente actual no superó la verificación.' }
          $Version = "1.0.${{ github.run_number }}"
          $Body = @'
          Aula: control de mensualidades y administración mínima. Personal y Nómina retirados, incluidos employees, positions, payroll_plans, salary_receipts y expenses.employee_id. Esquema 12 con respaldo verificado, transacción, integridad, referencias y cadena original de bitácora conservadas. Egresos históricos de categoría Nómina conservan importes y números, sin empleado ni horarios.

          Instalación en cero: Mi colegio, sin registros de negocio ni usuarios; primer R-/E-/AL- en 1 y pisos cero. Asistente para crear administrador, plantilla vacía y modo Pruebas en carpeta temporal separada. Vaciar registros retirado de producción. Guía Puesta en producción instalada.

          Conserva cobros, recibos, tasas BCV, convenios, pase de año, caja, reportes, archivo de alumnos/representantes y A1–A5. Respaldos cifrados, sesiones, bitácora, WAL y FULL conservados. Restauración y conversión de respaldos antiguos migran la copia privada antes de publicarla; no se modifica el archivo de origen. B3 (firma) y B4 pendientes.

          Comprobantes: media carta vertical 396 × 612 puntos; opción ORIGINAL y COPIA en una carta horizontal de 792 × 612 puntos al 100 %, márgenes reducidos y espacio para firmas. Validación nativa WebView2; la impresora física del colegio requiere revisión local.

          La compilación exige suite completa, análisis Defender antes/después, instalación/ventanas/conservación, impresión PDF y actualización publicada con otra cuenta Windows real. Resultados en la ejecución asociada. No se afirma prueba física de impresora ni Windows 10/11 del usuario.

          '@
          [System.IO.File]::WriteAllText('dist/notas-version.txt', $Body, [System.Text.UTF8Encoding]::new($false))
          # Keep the artifact as a draft until checks and its release notes have been reviewed.
          $ReleaseOutput = @(gh release create "desktop-$Version" "dist/Aula-Colegio-Instalador-$Version.exe" "dist/Aula-Colegio-Instalador-$Version.exe.sha256" "descargas/Aula-Windows.zip" "descargas/Aula-Windows.sha256" --target $env:GITHUB_SHA --title "Aula - Windows $Version - revisión" --notes-file dist/notas-version.txt --draft 2>&1)
          $ReleaseExit = $LASTEXITCODE
          $ReleaseOutput | ForEach-Object { Write-Host $_ }
          if ($ReleaseExit -ne 0) {
            $Details = ($ReleaseOutput | ForEach-Object { "$_" }) -join "`n"
            $Details = $Details.Substring(0,[Math]::Min(3500,$Details.Length)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Guardar borrador del instalador::$Details"
            throw 'No se pudo guardar el borrador del instalador; no se ha publicado una descarga pública.'
          }
