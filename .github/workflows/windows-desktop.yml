name: Aplicación Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'colegio/**'
      - 'static/**'
      - 'tests/**'
      - 'packaging/**'
      - 'desktop_entry.py'
      - 'requirements-desktop.txt'

permissions:
  contents: write

concurrency:
  group: windows-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Compilar y validar el sistema
        shell: pwsh
        run: |
          try {
            ./packaging/build_windows.ps1 -Version "1.0.${{ github.run_number }}" *>&1 | Tee-Object -FilePath desktop-build.log
          } catch {
            $Details = ((Get-Content desktop-build.log | Select-Object -Last 45) -join "`n")
            $Details = $Details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Compilación Windows::$Details"
            throw
          }
      - name: Analizar con Defender antes de ejecutar el instalador
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist
      - name: Validar instalación, ventanas, pruebas y conservación de datos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./packaging/test_installer.ps1 -Version "1.0.${{ github.run_number }}"
          } catch {
            $Details = $_.Exception.Message + "`n" + ((Get-Content "$env:TEMP/AulaColegio-Compilacion/logs/*.log" -ErrorAction SilentlyContinue) -join "`n")
            $Details = $Details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Ventana Windows::$Details"
            throw
          }
      - name: Guardar diagnóstico de la ventana si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Windows
          path: C:/Users/runneradmin/AppData/Local/Temp/AulaColegio-Compilacion/logs/*.log
          if-no-files-found: ignore
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Aula-Windows-Instalador
          path: |
            dist/Aula-Colegio-Instalador-*.exe
            dist/Aula-Colegio-Instalador-*.sha256
          if-no-files-found: error
      - name: Publicar instalador descargable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = "1.0.${{ github.run_number }}"
          $Body = @'
          Aplicación Windows de 64 bits con Python incluido, ventana propia y accesos directos. Instala el archivo .exe con la misma cuenta de Windows que usabas para conservar los datos. Las laptops de consulta pueden conectarse a la PC principal mediante Tailscale. El componente WebView2 de Microsoft puede necesitar internet durante la primera instalación. Cerrar la ventana principal minimiza Aula junto al reloj; usa «Salir y cerrar Aula» para detener el sistema compartido. Incluye un acceso separado para pruebas y herramientas de recuperación. La compilación supera las pruebas de datos y una comprobación de la ventana nativa antes de publicarse.

          Incluye la interfaz móvil instalable para Android/iPhone: abre el enlace privado HTTPS en Chrome → Instalar aplicación, o Safari → Compartir → Añadir a pantalla de inicio. El teléfono debe estar autorizado y conectado a la red privada. La PC principal sigue guardando todos los datos y debe permanecer encendida. Aula-Movil-Web.zip contiene el HTML/CSS/JavaScript editable, requiere el servidor de Aula y no es un APK ni un sistema independiente.

          Para probar desde el teléfono sin configurar Tailscale, conecta PC y teléfono al mismo Wi-Fi y abre «Aula - Probar en teléfono». La PC muestra la dirección y un código de seis dígitos. Esta opción permite usar todos los módulos sobre una base temporal separada; cerrar la ventana de la PC termina la prueba y borra sus datos. No proporciona acceso remoto a la base real.
          '@
          [System.IO.File]::WriteAllText('dist/notas-version.txt', $Body, [System.Text.UTF8Encoding]::new($false))
          # Public downloads are paused while the 1.0.8 Defender report is investigated.
          $ReleaseOutput = @(gh release create "desktop-$Version" "dist/Aula-Colegio-Instalador-$Version.exe" "dist/Aula-Colegio-Instalador-$Version.exe.sha256" "descargas/Aula-Movil-Web.zip" "descargas/Aula-Movil-Web.sha256" --target $env:GITHUB_SHA --title "Colegio - Instalador Windows $Version - revisión" --notes-file dist/notas-version.txt --draft 2>&1)
          $ReleaseExit = $LASTEXITCODE
          $ReleaseOutput | ForEach-Object { Write-Host $_ }
          if ($ReleaseExit -ne 0) {
            $Details = ($ReleaseOutput | ForEach-Object { "$_" }) -join "`n"
            $Details = $Details.Substring(0,[Math]::Min(3500,$Details.Length)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Guardar borrador del instalador::$Details"
            throw 'No se pudo guardar el borrador del instalador; no se ha publicado una descarga pública.'
          }
