name: Tanda D · validación Windows
on:
  push:
    branches: [tanda-d]
    paths:
      - 'colegio/**'
      - 'static/**'
      - 'tests/**'
      - 'packaging/**'
      - '.github/workflows/tanda-d.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tanda-d-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador real
        shell: pwsh
        run: |
          npm install --no-save playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'No se instaló Playwright.' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'No se instaló Chromium.' }
      - name: Inventario anterior y dependencias fijadas
        shell: pwsh
        run: ./packaging/inventory_previous.ps1
      - name: Suite completa y compilación 1.0.69
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Version '1.0.69' *>&1 | Tee-Object -FilePath tanda-build.log
      - name: Tres recorridos de navegador
        shell: pwsh
        run: |
          python tests/run_browser.py *>&1 | Tee-Object -FilePath tanda-browser.log
          if ($LASTEXITCODE -ne 0) { throw 'Falló navegador normal.' }
          python tests/run_browser.py --demo *>&1 | Tee-Object -FilePath tanda-demo.log
          if ($LASTEXITCODE -ne 0) { throw 'Falló navegador Pruebas.' }
          python tests/run_browser.py --roster *>&1 | Tee-Object -FilePath tanda-roster.log
          if ($LASTEXITCODE -ne 0) { throw 'Falló navegador matrículas.' }
      - name: Medición HTTP de seis cargas
        shell: pwsh
        run: |
          python tests/benchmark_state.py --output state-windows.csv *>&1 | Tee-Object -FilePath tanda-benchmark.log
          if ($LASTEXITCODE -ne 0) { throw 'Falló la medición HTTP.' }
      - name: Defender antes de instalar
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist
      - name: Instalación, ventanas e impresión nativa
        env:
          AULA_RECEIPT_REPORT_DIR: ${{ runner.temp }}/aula-recibo-native
        shell: pwsh
        run: ./packaging/test_installer.ps1 -Version '1.0.69' *>&1 | Tee-Object -FilePath tanda-installer.log
      - name: Instalación en cero, actualización publicada y otra cuenta real
        shell: pwsh
        run: ./packaging/test_b1_windows.ps1 -Version '1.0.69' *>&1 | Tee-Object -FilePath tanda-upgrade.log
      - name: Evidencia de PDF e impresión
        shell: pwsh
        run: |
          python -m pip install pypdf==6.10.0 PyMuPDF==1.26.6
          python tests/verify_receipt_prints.py "$env:RUNNER_TEMP/aula-recibo-native"
          if ($LASTEXITCODE -ne 0) { throw 'Falló la verificación de PDF nativo.' }
      - name: Defender final
        shell: pwsh
        run: ./packaging/scan_windows.ps1 -Path dist -ReportDir "$env:RUNNER_TEMP/defender-tanda-final"
      - name: Guardar evidencia real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tanda-D-evidencia
          path: |
            tanda-*.log
            state-windows.csv
            ${{ runner.temp }}/aula-recibo-native/
          if-no-files-found: warn
      - name: Entregar solo el instalador validado
        uses: actions/upload-artifact@v4
        with:
          name: Aula-1.0.69-validado
          path: dist/Aula-Colegio-Instalador-1.0.69.exe
          if-no-files-found: error
