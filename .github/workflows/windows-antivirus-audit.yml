name: Revisar instalador con Microsoft Defender
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.0.8'
            run_id: '37727443621'
            sha256: '7852d8436ae2678ad33a1e1b55022e93949754d795f00f5ec517408fe8e5d8ad'
          - version: '1.0.14'
            run_id: '37836753883'
            sha256: 'ed475caff54c5df4be1f7aff5f17d89181fcddf4524dd5cd46ac1e7f3cc91352'
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar el informe del primer análisis
        if: matrix.version == '1.0.8'
        uses: actions/download-artifact@v4
        with:
          name: Informe-Defender-1.0.8
          run-id: 37728590559
          github-token: ${{ github.token }}
          path: audit/first-report
      - name: Mostrar motor, firmas y resultado del primer análisis
        if: matrix.version == '1.0.8'
        shell: pwsh
        run: |
          $Report = 'audit/first-report'
          $Details = (Get-Content "$Report/motor.json" -Raw) + "`n" + (Get-Content "$Report/resultado.txt" -Raw) + "`n" + (Get-Content "$Report/archivos.json" -Raw)
          $Details = $Details.Substring(0,[Math]::Min(3500,$Details.Length)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
          Write-Host "::notice title=Primer informe Defender - archivo oficial::$Details"
      - uses: actions/download-artifact@v4
        with:
          name: Aula-Windows-Instalador
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: audit/incoming
      - name: Comprobar identidad del archivo reportado
        shell: pwsh
        env:
          AUDIT_INSTALLER: Aula-Colegio-Instalador-${{ matrix.version }}.exe
          AUDIT_SHA256: ${{ matrix.sha256 }}
        run: |
          $Target = Join-Path 'audit/incoming' $env:AUDIT_INSTALLER
          $Actual = (Get-FileHash $Target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Actual -ne $env:AUDIT_SHA256) { throw 'El archivo no coincide con el instalador oficial. No se continuará.' }
          $Signature = Get-AuthenticodeSignature $Target
          $Signer = if ($Signature.SignerCertificate) { $Signature.SignerCertificate.Subject } else { $null }
          New-Item -ItemType Directory -Force -Path audit/identity | Out-Null
          [PSCustomObject]@{name=$env:AUDIT_INSTALLER;sha256=$Actual;signatureStatus="$($Signature.Status)";signer=$Signer} |
            ConvertTo-Json | Set-Content 'audit/identity/archivo.json' -Encoding utf8
          Write-Host "::notice title=Identidad del instalador::$($env:AUDIT_INSTALLER); SHA256 $Actual; firma $($Signature.Status)"
      - name: Analizar sin ejecutar ni instalar el archivo
        shell: pwsh
        run: |
          try {
            ./packaging/scan_windows.ps1 -Path audit/incoming
            $Report = Join-Path $env:RUNNER_TEMP 'Aula-Antivirus'
            $Details = (Get-Content "$Report/motor.json" -Raw) + "`n" + (Get-Content "$Report/resultado.txt" -Raw) + "`n" + (Get-Content "$Report/archivos.json" -Raw)
            $Details = $Details.Substring(0,[Math]::Min(3500,$Details.Length)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::notice title=Defender - resultado del archivo oficial::$Details"
          } catch {
            $Details = $_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Análisis antivirus::$Details"
            throw
          }
      - name: Conservar el informe de análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Informe-Defender-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/Aula-Antivirus/*
            audit/identity/*
          if-no-files-found: warn
